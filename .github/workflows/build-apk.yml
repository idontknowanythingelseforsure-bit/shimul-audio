name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "buildozer.spec"
      - "main.py"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-v2
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - name: Re-sign APK with fixed key
        run: |
          BUILD_TOOLS=$(ls -d "$HOME"/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          APK=$(ls bin/*.apk | head -n 1)
          echo "Signing: $APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "${APK%.apk}-signed.apk" \
            "$APK"
          mv -f "${APK%.apk}-signed.apk" "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shimul-audio-apk
          path: bin/*.apk
          if-no-files-found: error
