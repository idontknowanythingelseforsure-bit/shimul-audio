name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-exe.yml"

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name "Shimul Audio" --icon "assets/icon.ico" --collect-all kivymd main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: shimul-audio-exe
          path: dist/Shimul Audio.exe
          if-no-files-found: error
