name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-exe.yml"

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Collecting kivymd makes PyInstaller *import* KivyMD, which imports
      # kivy.core.window. CI runners only expose OpenGL 1.1, so Kivy raises a
      # MODAL "Kivy Fatal Error" dialog and the build hangs forever. The mock
      # backend skips the OpenGL requirement at build time only (it is not
      # baked into the produced exe).
      KIVY_GL_BACKEND: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        timeout-minutes: 10
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name "Shimul Audio" --icon "assets/icon.ico" --collect-all kivymd main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: shimul-audio-exe
          path: dist/Shimul Audio.exe
          if-no-files-found: error
